; uSEQ-Celium firmware — two envs, one tree.
;   main     — lives on the uSEQ v1.0 main module (USB CDC <-> CV/Gate + I2C)
;   expander — lives on the 8-channel expander board (I2C slave <-> 8 PWM CVs)
;
; Both envs use the Earle Philhower arduino-pico core (via the maxgerhardt
; fork of platform-raspberrypi) so we get the non-mbed Arduino API plus
; analogWriteRange/analogWriteFreq and Wire1.setSDA/setSCL.

[platformio]
src_dir = src

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags =
    -O3
    -Wall
    -Wextra
    -I${PROJECT_DIR}/include
build_unflags =
    -Os
lib_deps =

[env:main]
; Runs on the uSEQ v1.0 main module (Pico RP2040). DIGI_OUT_INVERTED flips
; the 3 gate GPIOs; USEQHARDWARE_1_0 pins come from uSEQ's pinmap.h (for
; reference — we hard-code the three CV + three gate pins ourselves).
build_src_filter = +<main/>
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_1_0
    -DDIGI_OUT_INVERTED

[env:expander]
; Runs on the expander board (also a Pico RP2040) — I2C slave, 8 PWM outs.
build_src_filter = +<expander/>
build_flags =
    ${env.build_flags}
    -DUSEQHARDWARE_EXPANDER_OUT_0_1
