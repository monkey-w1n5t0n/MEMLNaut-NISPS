<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MEMLNaut NISPS</title>
  <style>
    :root {
      --glass-bg: rgba(10, 10, 20, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-blur: 12px;
      --accent: #00d4ff;
      --accent-dim: rgba(0, 212, 255, 0.3);
      --danger: #ff3b5c;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --text: #e0e0e8;
      --text-dim: #888;
      --radius: 12px;
      --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --dock-width: 48px;
      --dock-gap: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a14;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
    }

    .drawer::-webkit-scrollbar { width: 3px; }
    .drawer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    @media (max-width: 480px) {
      :root {
        --dock-width: 40px;
      }
      .dock-icon { width: 32px; height: 32px; }
      .drawer { width: 220px; }
      .rl-btn { width: 48px; height: 48px; }
    }

    @media (min-width: 768px) {
      .rl-btn { width: 72px; height: 72px; font-size: 1.6em; }
      .drawer { width: 280px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
